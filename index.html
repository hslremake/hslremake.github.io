<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>幻世錄 Remake — HSLR</title>
<script>(function(){try{
var p=localStorage.getItem('hslr-lang');
if(!p){var l=(navigator.language||'').toLowerCase();
p=l.indexOf('zh')===0?((l.indexOf('cn')>=0||l.indexOf('sg')>=0||l.indexOf('hans')>=0||l.indexOf('chs')>=0)?'cn':'zh'):'en';}
location.replace(p==='en'?'/en/mod/':p==='cn'?'/cn/mod/':'/mod/');
}catch(e){location.replace('/mod/');}})();</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:40px;line-height:1.8">

<p><a href="/en/mod/">HSLR MOD Guide (English)</a></p>
</body>
</html>
